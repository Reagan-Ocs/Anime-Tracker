<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Knight Watch: The premier anime tracker for serious fans. Organize your watchlist, log your episode progress, and command your anime archive with ease."
    />
    <meta name="author" content="Reagan" />
    <title>Knight Watch</title>
  </head>
  <body>
    <header>
      <div class="logo">
        <img src="Images/logo.png" alt="Knight Watch Logo" />
      </div>
      <nav class="nav-links">
        <ul>
          <li><a href="#home">Home</a></li>
          <li><a href="#index">Anime Index</a></li>
          <li><a href="#contact">Contact</a></li>
          <li><a href="#collection">Sacred Chronicles</a></li>
          <li><a href="#rankings">Knight Rankings</a></li>
          <li><a href="#my-list">My Watchlist</a></li>
          <li><a href="#contact">Profile</a></li>
          <li><a href="#alerts">Watch Tower Alerts</a></li>
          <li><a href="#search">Search</a></li>
          <li><a href="#about">About</a></li>
        </ul>
      </nav>
      <div class="nav-actions">
        <form action="/search-results" method="GET">
          <input
            type="text"
            name="anime"
            placeholder="Search anime..."
            aria-label="Search anime"
          />
          <button type="submit" aria-label="Search">text</button>
        </form>
        <button
          class="menu-toggle"
          id="menuToggle"
          aria-label="Toggle navigation Menu"
          aria-expanded="false"
        >
          <span>text</span>
          <span>text</span>
          <span>text</span>
        </button>
      </div>
    </header>
    <!---Glassmorphism effect for the header--->
    <aside
      class="sidebar-glassmorphism"
      id="animeFormSidebar"
      aria-hidden="true"
    >
  
  </aside>
  </body>
</html>
